<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ViewBox Panel</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#14213d;--mute:#5a6478;--pri:#3b5bdb;--ok:#1a7f4b;--bad:#b42318;--warn:#a15c07;--line:#dfe3ec}
@media(prefers-color-scheme:dark){:root{--bg:#10131a;--card:#181d27;--ink:#eef1f7;--mute:#a3acbd;--pri:#7b93ff;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;--line:#2a3140}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:960px;margin:0 auto;padding:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
input,select,button{font:inherit;min-height:44px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%;margin:4px 0}
button{background:var(--pri);color:#fff;border:0;cursor:pointer;font-weight:600}button.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
nav{display:flex;gap:8px;flex-wrap:wrap}nav button{width:auto}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.err{color:var(--bad)}.mute{color:var(--mute)}.tag{padding:2px 8px;border-radius:99px;font-size:13px;border:1px solid currentColor;white-space:nowrap}
.Approved,.Completed{color:var(--ok)}.Rejected,.Failed{color:var(--bad)}.Waitlisted,.Fit{color:var(--warn)}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--card)}.otp{font-size:24px;letter-spacing:4px;font-weight:700}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:420px;width:calc(100% - 32px)}dialog::backdrop{background:#0008}textarea{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}label{display:block;margin:6px 0}
</style></head><body><main>
<nav><button class="sec" onclick="show('member')">Member</button><button class="sec" onclick="show('admin')">Admin</button></nav>
<div id="app"></div></main><dialog id=dlg></dialog>
<script>
const $=s=>document.querySelector(s),app=$('#app'),qs=new URLSearchParams(location.search);
if(qs.get('src')){localStorage.vb_src=qs.get('src');if(!localStorage.vb_first)localStorage.vb_first=qs.get('src')}
if(qs.get('ref'))localStorage.vb_ref=qs.get('ref');
const L=()=>({src:qs.get('src')||localStorage.vb_src||'',ref:qs.get('ref')||localStorage.vb_ref||'',first:localStorage.vb_first||''});
let tok={member:localStorage.mt,admin:localStorage.at},ctx={phone:'',otp:''};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p,o={},role){
  const h={...(o.headers||{})};if(!(o.body instanceof FormData)&&o.body)h['Content-Type']='application/json';
  if(role&&tok[role])h.Authorization='Bearer '+tok[role];
  try{const r=await fetch(p,{...o,headers:h});
    if(!r.ok){let d={};try{d=await r.json()}catch{};const m=typeof d.detail==='string'?d.detail:(Array.isArray(d.detail)&&String(d.detail[0]?.msg).startsWith('Value error, ')?d.detail[0].msg.slice(13):'Please check the details you entered and try again.');
      if(r.status===401&&role){tok[role]=null;show(role)}throw new Error(m)}
    return r.headers.get('content-type')?.includes('json')?r.json():r.blob()}
  catch(e){throw new Error(e.message==='Failed to fetch'?'Cannot reach the server. Check your connection.':e.message)}}
const msg=(t,c='err')=>`<p class="${c}" role="alert">${esc(t)}</p>`;
function show(w){w==='admin'?admin():member()}
// ---------- member ----------
function member(){tok.member?home():phoneStep()}
function phoneStep(e=''){app.innerHTML=`<div class="card"><h2>Welcome to ViewBox</h2><p class="mute">Enter your mobile number to log in or join.</p>${e}
<input id=ph inputmode=numeric maxlength=10 placeholder="10-digit mobile" value="${ctx.phone}"><button onclick="sendOtp()">Send OTP</button></div>`}
async function sendOtp(){ctx.phone=$('#ph').value.trim();try{const r=await api('/api/otp/request',{method:'POST',body:JSON.stringify({phone:ctx.phone})});ctx.isMember=r.is_member;
  app.innerHTML=`<div class="card"><h2>Verify</h2><p class="mute">Demo mode: your OTP is shown here (no SMS sent).</p><p class="otp">${r.otp}</p><input id=otp inputmode=numeric maxlength=6 placeholder="Enter OTP" value="${r.otp}"><div id=e></div><button onclick="verify()">Continue</button></div>`}catch(e){phoneStep(msg(e.message))}}
async function verify(){ctx.otp=$('#otp').value.trim();if(ctx.isMember){try{const r=await api('/api/login',{method:'POST',body:JSON.stringify({phone:ctx.phone,otp:ctx.otp})});localStorage.mt=tok.member=r.token;home()}catch(e){$('#e').innerHTML=msg(e.message)}}else signupForm()}
async function signupForm(){const l=L();const rs=await api(`/api/links/resolve?src=${encodeURIComponent(l.src)}&ref=${encodeURIComponent(l.ref)}`).catch(()=>({needs_fallback:true}));let how='';
  const banner=rs.source?`<p class=mute>You were invited via ${esc(rs.source)}</p>`:rs.referrer?`<p class=mute>Invited by ${esc(rs.referrer)}</p>`:'';
  const rph=l.ref?'':`<input id=rph inputmode=numeric maxlength=10 placeholder="Referrer's mobile number (optional)">`;
  if(rs.needs_fallback){const s=await api('/api/sources/public').catch(()=>[]);how=`<label>How did you hear about us?<select id=how><option value="">Select…</option>${s.map(x=>`<option value=${x.id}>${esc(x.name)}</option>`).join('')}</select></label>`}
  app.innerHTML=`<div class="card"><h2>Tell us about you</h2>${banner}<div id=e></div><input id=nm placeholder="Full name"><label>Date of birth<input id=dob type=date></label>
  <select id=g><option value="">Gender</option><option>Male</option><option>Female</option><option>Other</option></select><input id=city placeholder="City">
  <select id=inc><option value="">Income range</option><option>&lt;5L</option><option>5-10L</option><option>10L+</option></select>
  <input id=ints placeholder="Interests (comma separated, e.g. food, tech)">${how}${rph}<button onclick="signup()">Join</button></div>`}
async function signup(){const l=L(),b={phone:ctx.phone,otp:ctx.otp,name:$('#nm').value,dob:$('#dob').value,gender:$('#g').value,city:$('#city').value,income_range:$('#inc').value,
  interests:$('#ints').value.split(',').map(x=>x.trim()).filter(Boolean),src:l.src||null,ref:l.ref||null,first_src:l.first||null,referrer_phone:$('#rph')?.value||null,how_heard_source_id:+($('#how')?.value)||null};
  try{const r=await api('/api/signup',{method:'POST',body:JSON.stringify(b)});['vb_src','vb_ref','vb_first'].forEach(k=>localStorage.removeItem(k));localStorage.mt=tok.member=r.token;home()}catch(e){$('#e').innerHTML=msg(e.message)}}
async function home(){app.innerHTML='<div class="card">Loading…</div>';
  try{const[m,s,r,st]=await Promise.all([api('/api/me',{},'member'),api('/api/surveys',{},'member'),api('/api/me/referrals',{},'member'),api('/api/me/status',{},'member')]);
  const SX={Lead:'You have signed up. Our team is checking your profile against survey criteria.',Fit:'Your profile matches. You are in the pool for upcoming surveys.',Completed:'You completed a survey. Thank you!',Failed:'Your profile was not selected this time.'},PS={Pending:'Pending ops approval',Approved:'Approved, payment on the way',Paid:'Paid'};
  app.innerHTML=`<div class="card"><h2>Hi ${esc(m.name)}</h2><p class="mute">${esc(m.phone)} · ${esc(m.city)}</p>${m.next_eligible_date?`<p class="Waitlisted">Cool-off active: you can join new surveys again on ${m.next_eligible_date}.</p>`:''}
  <button class="sec" style="width:auto" onclick="localStorage.removeItem('mt');tok.member=null;member()">Log out</button></div>
  <h3>Your status</h3><div class=card><span class="tag ${st.stage}">${st.stage}</span> ${esc(SX[st.stage])} ${st.failure_reason?`<p class=mute>Reason: ${esc(st.failure_reason)}</p>`:''}
  ${st.completions.length?`<p><b>Completed:</b> ${st.completions.map(c=>esc(c.survey)+' on '+c.completed_at+(c.quality_passed?'':' (quality check failed)')).join(', ')}</p>`:''}
  ${st.payouts.length?`<div class=wrap><table><tr><th>Earning</th><th>Amount</th><th>Status</th></tr>${st.payouts.map(p=>`<tr><td>${p.kind}</td><td>₹${p.amount}</td><td>${PS[p.status]||p.status}</td></tr>`).join('')}</table></div>`:'<p class=mute>No earnings yet.</p>'}</div>
  <h3>Live surveys</h3>${s.length?s.map(x=>`<div class="card" style="${x.matches_interests?'border-color:var(--pri)':''}"><b>${esc(x.title)}</b> ${x.matches_interests?'<span class="tag" style="color:var(--pri)">Matches your interests</span>':''}
  <p class="mute">${esc(x.description)} · ₹${x.amount} · closes ${(x.deadline||'').slice(0,10)}</p><span class="tag ${x.result}">${x.result}</span> ${esc(x.reason)}</div>`).join(''):'<div class="card mute">No live surveys right now. Check back soon.</div>'}
  <h3>Invite friends</h3><div class="card"><p class="mute">Share your personal link. You earn a bonus when a friend completes a survey.</p><input readonly value="${esc(m.referral_link)}" onclick="this.select()">
  ${r.length?`<div class=wrap><table><tr><th>Friend</th><th>Phone</th><th>Stage</th><th>Bonus</th><th>Note</th></tr>${r.map(x=>`<tr><td>${esc(x.friend)}</td><td>${x.phone}</td><td><span class="tag ${x.stage}">${x.stage}</span></td><td>${x.bonus?'₹'+x.bonus.amount+' · '+(PS[x.bonus.status]||x.bonus.status):(x.stage==='Completed'?'':'—')}</td><td>${esc(x.failure_reason||'')}</td></tr>`).join('')}</table></div>`:'<p class="mute">No friends invited yet.</p>'}</div>`}
  catch(e){app.innerHTML=`<div class="card">${msg(e.message)}<button onclick="home()">Retry</button></div>`}}
// ---------- admin ----------
function admin(){tok.admin?grid():app.innerHTML=`<div class="card"><h2>Admin login</h2><div id=e></div><input id=em placeholder="Email" value="admin@concave.test"><input id=pw type=password placeholder="Password"><button onclick="alogin()">Log in</button></div>`}
async function alogin(){try{const r=await api('/api/admin/login',{method:'POST',body:JSON.stringify({email:$('#em').value,password:$('#pw').value})});localStorage.at=tok.admin=r.token;grid()}catch(e){$('#e').innerHTML=msg(e.message)}}
function atabs(){return`<nav><button onclick=grid()>Members</button><button onclick=surveys()>Surveys</button><button onclick=sources()>Sources</button><button onclick=stats()>Source stats</button><button onclick=imp()>Import CSV</button><button class=sec onclick="localStorage.removeItem('at');tok.admin=null;admin()">Log out</button></nav>`}
let F={q:'',source_id:'',city:'',status:''},t;
const fq=()=>new URLSearchParams(Object.entries(F).filter(([,v])=>v)).toString();
async function grid(){app.innerHTML=atabs()+`<div class="card" style="position:sticky;top:0;z-index:2"><div class=row><input id=q placeholder="Search name, ID, city…" value="${esc(F.q)}" oninput="F.q=this.value;clearTimeout(t);t=setTimeout(rows,250)">
  <select id=src onchange="F.source_id=this.value;rows()"><option value="">All sources</option></select><input placeholder="City" value="${esc(F.city)}" oninput="F.city=this.value;clearTimeout(t);t=setTimeout(rows,250)">
  <select onchange="F.status=this.value;rows()">${['','Lead','Fit','Completed','Failed','flagged'].map(s=>`<option value="${s}" ${F.status===s?'selected':''}>${s||'All statuses'}</option>`).join('')}</select><button onclick="exp()">Export CSV (current view)</button></div></div><div id=g class=card></div>`;
  api('/api/admin/sources',{},'admin').then(s=>{$('#src').innerHTML+=s.map(x=>`<option value=${x.id} ${F.source_id==x.id?'selected':''}>${esc(x.name)}</option>`).join('')}).catch(()=>{});rows()}
async function rows(){$('#g').innerHTML='Loading…';try{const d=await api('/api/admin/members?'+fq(),{},'admin');
  $('#g').innerHTML=d.length?`<p class=mute>${d.length} members</p><div class=wrap><table><tr><th>ID</th><th>Name</th><th>Phone</th><th>City</th><th>Source</th><th>Referrer</th><th>Stage</th><th>Action</th></tr>${d.map(x=>`<tr><td>${x.id}</td><td>${esc(x.name)}</td><td>${x.phone}</td><td>${esc(x.city)}</td><td>${esc(x.source)}</td><td>${esc(x.referrer)}</td><td><span class="tag ${x.stage}">${x.stage}</span></td>
  <td><button class=sec style="width:auto;min-height:36px" onclick="stage(${x.referral_id},'Fit')">Fit</button> <button class=sec style="width:auto;min-height:36px" onclick="stage(${x.referral_id},'Completed')">Completed</button> <button class=sec style="width:auto;min-height:36px" onclick="stage(${x.referral_id},'Failed')">Fail</button></td></tr>`).join('')}</table></div>`:'<p class=mute>No members match these filters.</p>'}
  catch(e){$('#g').innerHTML=msg(e.message)}}
function openDlg(x){$('#dlg').innerHTML=x;$('#dlg').showModal()}
async function stage(id,s){
  if(s==='Fit')return sendStage(id,{stage:'Fit'});
  if(s==='Failed')return openDlg(`<h3>Mark as failed</h3><textarea id=dr rows=3 style="width:100%" placeholder="Reason (shown to the referrer)"></textarea><div id=de></div><button onclick="sendStage(${id},{stage:'Failed',failure_reason:$('#dr').value.trim()})">Save</button><button class=sec onclick="$('#dlg').close()">Cancel</button>`);
  let sv=[];try{sv=await api('/api/admin/surveys',{},'admin')}catch(e){return alert(e.message)}
  if(!sv.length)return alert('Create a survey first (Surveys tab).');
  openDlg(`<h3>Mark as completed</h3><label>Which survey?<select id=ds>${sv.map(x=>`<option value=${x.id}>${esc(x.title)}</option>`).join('')}</select></label><label><input type=checkbox id=dq checked style="width:auto;min-height:0"> Quality check passed</label><div id=de></div><button onclick="sendStage(${id},{stage:'Completed',survey_id:+$('#ds').value,quality_check_passed:$('#dq').checked})">Save</button><button class=sec onclick="$('#dlg').close()">Cancel</button>`)}
async function sendStage(id,b){try{await api(`/api/admin/referrals/${id}/stage`,{method:'POST',body:JSON.stringify(b)},'admin');$('#dlg').close();rows()}catch(e){$('#de')?$('#de').innerHTML=msg(e.message):alert(e.message)}}
async function exp(){try{const b=await api('/api/admin/members/export?'+fq(),{},'admin');const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='members.csv';a.click()}catch(e){alert(e.message)}}
async function surveys(){app.innerHTML=atabs()+'<div class=card>Loading…</div>';try{const d=await api('/api/admin/surveys',{},'admin');
  app.innerHTML=atabs()+`<div class=card><h3>New survey</h3><div id=e></div><input id=sT placeholder="Title"><input id=sD placeholder="Topics / description (used to highlight matching interests)"><div class=row><label>Deadline<input id=sDl type=date></label><label>Quota<input id=sQ type=number min=1></label><label>Pay (₹)<input id=sA type=number min=0 value=0></label></div>
  <h4>Eligibility rules</h4><div id=rl></div><button class=sec onclick=addRule()>+ Add rule</button><button onclick=saveSurvey()>Create survey</button></div>
  <div class="card wrap"><h3>Surveys</h3>${d.length?`<table><tr><th>Title</th><th>Deadline</th><th>Quota</th><th>Done</th><th>Pay</th><th>Rules</th></tr>${d.map(x=>`<tr><td>${esc(x.title)}</td><td>${x.deadline||'—'}</td><td>${x.quota||'—'}</td><td>${x.completions}</td><td>₹${x.amount}</td><td>${x.rules.map(r=>esc(r.rule_type+': '+r.value)+' ('+r.strict_or_flexible+')').join('; ')||'none'}</td></tr>`).join('')}</table>`:'<p class=mute>No surveys yet. Create the first one above.</p>'}</div>`;addRule()}catch(e){app.innerHTML=atabs()+msg(e.message)}}
function addRule(){const d=document.createElement('div');d.className='row rule';d.innerHTML='<select class=rt><option value=age>Age</option><option value=city>City</option><option value=gender>Gender</option><option value=income>Income</option></select><input class=rv placeholder="Age: 18-35 · Others: Mumbai,Pune"><select class=rs><option value=strict>Strict</option><option value=flexible>Flexible</option></select><button class=sec type=button onclick="this.parentNode.remove()">Remove</button>';$('#rl').appendChild(d)}
async function saveSurvey(){const rules=[...document.querySelectorAll('.rule')].map(r=>({rule_type:r.querySelector('.rt').value,value:r.querySelector('.rv').value.trim(),strict_or_flexible:r.querySelector('.rs').value})).filter(r=>r.value);const dl=$('#sDl').value;
  const b={title:$('#sT').value.trim(),description:$('#sD').value.trim(),deadline:dl?dl+'T23:59:59':null,quota:+$('#sQ').value||null,amount:+$('#sA').value||0,rules};
  try{await api('/api/admin/surveys',{method:'POST',body:JSON.stringify(b)},'admin');surveys()}catch(e){$('#e').innerHTML=msg(e.message)}}
async function sources(){app.innerHTML=atabs()+'<div class=card>Loading…</div>';try{const s=await api('/api/admin/sources',{},'admin');
  app.innerHTML=atabs()+`<div class=card><h3>Add source</h3><div id=e></div><div class=row><input id=sn placeholder="Name e.g. WhatsApp - Pune"><input id=st list=types placeholder="Type e.g. whatsapp"><datalist id=types><option>whatsapp<option>staff<option>instagram<option>facebook<option>website<option>referral<option>linkedin</datalist><button onclick=addSrc()>Add</button></div></div>
  <div class="card wrap"><table><tr><th>Name</th><th>Type</th><th>Signed signup link</th></tr>${s.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.type}</td><td><input readonly value="${esc(x.link)}" onclick="this.select()"></td></tr>`).join('')}</table></div>`}catch(e){app.innerHTML=atabs()+msg(e.message)}}
async function addSrc(){try{await api('/api/admin/sources',{method:'POST',body:JSON.stringify({name:$('#sn').value,type:$('#st').value})},'admin');sources()}catch(e){$('#e').innerHTML=msg(e.message)}}
async function stats(){app.innerHTML=atabs()+'<div class=card>Loading…</div>';try{const d=await api('/api/admin/source-stats',{},'admin');
  app.innerHTML=atabs()+`<div class="card wrap"><h3>Source dashboard</h3>${d.length?`<table><tr><th>Source</th><th>Sign-ups</th><th>Fit</th><th>Completed</th></tr>${d.map(x=>`<tr><td>${esc(x.source)}</td><td>${x.signups}</td><td>${x.fit}</td><td>${x.completed}</td></tr>`).join('')}</table>`:'<p class=mute>No data yet.</p>'}</div>`}catch(e){app.innerHTML=atabs()+msg(e.message)}}
function imp(){app.innerHTML=atabs()+`<div class=card><h3>Import respondents (CSV)</h3><p class=mute>Bad rows are fixed or skipped, never crash the import.</p><input id=f type=file accept=".csv"><button onclick=doImp()>Import</button><div id=r></div></div>`}
async function doImp(){const f=$('#f').files[0];if(!f)return $('#r').innerHTML=msg('Please choose a CSV file first.');$('#r').innerHTML='Importing…';const fd=new FormData();fd.append('file',f);
  try{const d=await api('/api/admin/import',{method:'POST',body:fd},'admin');$('#r').innerHTML=`<p><b>${d.imported}</b> imported · <b>${d.fixed}</b> fixed · <b>${d.skipped}</b> skipped of ${d.total_rows}</p><div class=wrap><table><tr><th>Row</th><th>Action</th><th>Reason</th></tr>${d.details.map(x=>`<tr><td>${x.row}</td><td>${x.action}</td><td>${esc(x.reason)}</td></tr>`).join('')}</table></div>`}catch(e){$('#r').innerHTML=msg(e.message)}}
(qs.get('src')||qs.get('ref'))?member():member();
</script></body></html>
